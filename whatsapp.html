<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp · Factoring Security</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Geist,system-ui,Segoe UI,Roboto,sans-serif;background:#0b141a;display:flex;justify-content:center}
.phone{width:100%;max-width:460px;min-height:100vh;display:flex;flex-direction:column;background:#efeae2}
.hd{background:#075E54;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;flex-shrink:0}
.hd .av{width:38px;height:38px;border-radius:9999px;background:#fff;color:#075E54;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.hd .nm{font-size:15px;font-weight:700;line-height:1.15}.hd .st{font-size:11px;opacity:.85}
.hd .ic{margin-left:auto;display:flex;gap:16px;font-size:17px;opacity:.9}
.chat{flex:1;padding:14px 12px 20px;overflow-y:auto;background-image:linear-gradient(rgba(229,221,213,.6),rgba(229,221,213,.6));background-color:#d9d2c9}
.day{text-align:center;margin:6px 0 12px}.day span{background:#d9e7ce;color:#4a5c50;font-size:11px;padding:4px 10px;border-radius:8px}
.msg{max-width:82%;margin:4px 0;padding:7px 9px 5px;border-radius:9px;font-size:13.5px;line-height:1.45;color:#111b21;box-shadow:0 1px .5px rgba(11,20,26,.13);position:relative;white-space:pre-wrap;word-wrap:break-word}
.in{background:#fff;border-top-left-radius:2px;margin-right:auto}
.out{background:#d9fdd3;border-top-right-radius:2px;margin-left:auto}
.who{display:block;font-size:11.5px;font-weight:700;color:#128C7E;margin-bottom:2px}
.tm{display:block;text-align:right;font-size:10px;color:#667781;margin-top:2px}
.btn{display:block;width:100%;margin:2px 0 6px;padding:11px;border:0;border-radius:9px;background:#128C7E;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.btn:disabled{background:#8fb8b1;cursor:default}
.sys{max-width:90%;margin:10px auto;background:#fff6d6;color:#5b5637;font-size:12px;text-align:center;padding:8px 12px;border-radius:9px}
.foot{background:#f0f2f5;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.foot input{flex:1;border:0;border-radius:9999px;padding:9px 14px;font-size:13.5px;background:#fff;outline:none;color:#111b21}
.foot .snd{width:40px;height:40px;border-radius:9999px;background:#075E54;color:#fff;border:0;font-size:16px;flex-shrink:0}
.done{background:#128C7E;color:#fff;text-align:center;font-size:13px;font-weight:600;padding:10px}
</style></head>
<body>
<div class="phone">
  <div class="hd">
    <div class="av">S</div>
    <div><div class="nm" id="hnm">Factoring Security</div><div class="st">en línea</div></div>
    <div class="ic">📹&nbsp;&nbsp;📞&nbsp;&nbsp;⋮</div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="foot">
    <input placeholder="Escribe un mensaje" disabled>
    <button class="snd">➤</button>
  </div>
</div>
<script>
(function(){
  function decode(){
    try{
      var h = location.hash || "";
      var i = h.indexOf("d=");
      if(i<0) return null;
      var enc = decodeURIComponent(h.slice(i+2));
      var json = decodeURIComponent(escape(atob(enc)));
      return JSON.parse(json);
    }catch(e){ return null; }
  }
  var data = decode() || { mensajes: [], payload: null };
  var neg = (new URLSearchParams(location.search)).get("n") || (data.payload && data.payload.neg) || "";
  var p = data.payload || {};
  var chat = document.getElementById("chat");
  if(p.empresa){ document.getElementById("hnm").textContent = "Factoring Security · " + (p.ejecutivo || "Ejecutivo"); }

  var esc = function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var whoLabel = function(f){ return f==="agente" ? "NEX · Asistente" : f==="ejecutivo" ? (p.ejecutivo || "Ejecutivo") : ""; };

  chat.insertAdjacentHTML("beforeend", '<div class="day"><span>Negocio N° '+esc(neg)+'</span></div>');

  var msgs = Array.isArray(data.mensajes) ? data.mensajes : [];
  if(!msgs.length){
    chat.insertAdjacentHTML("beforeend", '<div class="sys">No hay conversación para mostrar. Vuelve a abrir el enlace desde la plataforma.</div>');
  }
  msgs.forEach(function(m){
    var out = m.from === "cliente";
    var cls = out ? "out" : "in";
    var who = out ? "" : whoLabel(m.from);
    var html = '<div class="msg '+cls+'">';
    if(who) html += '<span class="who">'+esc(who)+'</span>';
    html += esc(m.text);
    if(m.time) html += '<span class="tm">'+esc(m.time)+'</span>';
    html += '</div>';
    chat.insertAdjacentHTML("beforeend", html);
    if(m.boton){
      chat.insertAdjacentHTML("beforeend",
        '<button class="btn" id="approve">🔒 '+esc(m.boton)+'</button>');
    }
  });

  function marcarAprobada(){
    if(document.getElementById("wa-done")) return;
    chat.insertAdjacentHTML("beforeend",
      '<div class="msg out" id="wa-done">✅ Operación N° '+esc(neg)+' aprobada y firmada.<span class="tm">ahora</span></div>');
    var b = document.getElementById("approve"); if(b) b.remove();
    var f = document.querySelector(".foot"); if(f){ f.outerHTML = '<div class="done">✔ Operación cursada · puedes cerrar esta ventana</div>'; }
    chat.scrollTop = chat.scrollHeight;
  }
  // El portal de curse (curse.html) avisa cuando el cliente firma; se relaya al app y se marca el hilo.
  window.addEventListener("message", function(ev){
    if(ev.data && ev.data.type === "aceptada"){ try{ if(window.opener) window.opener.postMessage(ev.data, "*"); }catch(e){} marcarAprobada(); }
  });
  var btn = document.getElementById("approve");
  if(btn){
    btn.addEventListener("click", function(){
      // Deriva a la plataforma de Factoring Security a cursar (login → oferta → firma), pasando el payload.
      var hi = location.hash.indexOf("d="); var enc = hi >= 0 ? location.hash.slice(hi + 2) : "";
      window.open("curse.html?n=" + encodeURIComponent(neg) + (enc ? ("#d=" + enc) : ""), "_blank");
    });
  }
  chat.scrollTop = chat.scrollHeight;
})();
</script>
</body></html>
